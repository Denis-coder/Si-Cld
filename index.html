<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Учёт СИ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#e9eef6"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#e9eef6;--dot:#cdd6e4;--fg:#172033;--mu:#66738a;--card:#fff;--br:#dfe6f0;--pri:#2557e7;--red:#d92d3a;--grn:#1f9d62;--yel:#e8960c;--sh:0 1px 2px #1b2a4a12,0 10px 28px #1b2a4a12}
@media(prefers-color-scheme:dark){:root{--bg:#0f141d;--dot:#1b2332;--fg:#e9edf5;--mu:#93a0b8;--card:#19202c;--br:#2a3446;--sh:0 1px 2px #0007}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1.3px,transparent 1.4px) 0 0/22px 22px;color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{padding:6px 14px 14px;max-width:760px;margin:auto}
button,select,input{font:inherit;color:var(--fg)}
input,select{padding:14px 16px;border-radius:18px;border:1px solid var(--br);background:var(--card);width:100%;box-shadow:var(--sh)}
input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--pri) 55%,transparent);border-color:var(--pri)}
button{cursor:pointer;padding:13px 16px;border-radius:18px;border:0;background:var(--pri);color:#fff;font-weight:650}
button.g{background:var(--card);color:var(--fg);box-shadow:var(--sh)}button.r{background:var(--red)}button.s{padding:7px 11px;font-size:13px;border-radius:11px}
button:disabled{opacity:.55}
.row{display:flex;gap:9px;flex-wrap:wrap;margin:9px 0}.row>*{flex:1;min-width:110px}.center{text-align:center}.sub{color:var(--mu);font-size:13.5px}
.hd{text-align:center;padding:18px 10px 6px}.hd img{width:66px;height:66px;border-radius:19px;box-shadow:var(--sh)}.hd h1{margin:9px 0 2px;font-size:25px;letter-spacing:-.4px}.hd small{color:var(--mu);font-size:14px}
.acts2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0 10px}.acts2 .big{grid-column:1/-1;padding:17px;font-size:17px}
.set{background:var(--card);border-radius:24px;padding:14px 16px;box-shadow:var(--sh);margin:10px 0}.set .sl{font-weight:650;margin-bottom:8px}
.seg{display:flex;background:color-mix(in srgb,var(--fg) 8%,var(--card));border-radius:15px;padding:4px;gap:4px}.seg button{flex:1;background:none;color:var(--mu);box-shadow:none;padding:10px;border-radius:12px}.seg button.on{background:var(--pri);color:#fff}
.tot{text-align:center;color:var(--mu);font-size:14px;margin:12px 0 4px}.tot b{color:var(--fg);font-size:17px}
.stat{background:var(--card);border-radius:28px;padding:16px 18px;margin:11px 0;box-shadow:var(--sh);display:flex;gap:16px;align-items:center;cursor:pointer;border:2px solid transparent}
.stat.on{border-color:var(--pri)}.sn2{font-size:50px;line-height:1;font-weight:760;letter-spacing:-2px;min-width:78px;text-align:center}.sb{flex:1;min-width:0}.sl{font-size:17px;font-weight:650}
.stat.red .sn2{color:var(--red)}.stat.yel .sn2{color:var(--yel)}.stat.grn .sn2{color:var(--grn)}.stat.res{background:color-mix(in srgb,var(--fg) 4%,var(--card))}.stat.res .sn2{color:var(--fg)}
.tcs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tc{background:color-mix(in srgb,var(--fg) 8%,var(--card));color:var(--fg);box-shadow:none;border-radius:99px;padding:6px 11px;font-size:13px;font-weight:600}.tc b{margin-left:3px}.tc.on{background:var(--pri);color:#fff}
.srch{position:relative;margin:14px 0 9px}.srch input{padding-left:48px;border-radius:99px}.srch:before{content:"🔍";position:absolute;left:18px;top:13px;font-size:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);color:var(--fg);box-shadow:var(--sh);padding:10px 17px;border-radius:99px;font-weight:650}
.chip.on{background:var(--pri);color:#fff}.chip em{font-style:normal;opacity:.7;margin-left:6px}
.cnt{color:var(--mu);font-size:14px;margin:6px 4px 10px}.cnt button{padding:3px 10px;border-radius:99px;font-size:12.5px;margin-left:6px}
.card{background:var(--card);border-radius:28px;padding:17px 18px 16px;margin:12px 0;box-shadow:var(--sh);position:relative}
.card.red{background:color-mix(in srgb,var(--red) 8%,var(--card))}.card.yel{background:color-mix(in srgb,var(--yel) 10%,var(--card))}
.ch{cursor:pointer}.c1{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.nm{font-weight:760;font-size:20px;line-height:1.2;letter-spacing:-.3px}.ty{color:var(--mu);font-size:14px;margin-top:2px}
.pill{flex:none;font-size:13px;font-weight:700;padding:7px 13px;border-radius:99px;background:color-mix(in srgb,var(--fg) 9%,var(--card));color:var(--mu);text-align:center;max-width:46%;line-height:1.2}
.red .pill{background:color-mix(in srgb,var(--red) 16%,var(--card));color:var(--red)}.yel .pill{background:color-mix(in srgb,var(--yel) 22%,var(--card));color:#9a6200}.grn .pill{background:color-mix(in srgb,var(--grn) 15%,var(--card));color:var(--grn)}
.sn{display:block;margin:9px 0 3px;font-size:18px;font-weight:600;color:var(--pri)}
.pl{font-size:15.5px;margin-top:3px;color:var(--mu)}.tag{color:var(--fg);font-weight:600}
.du{margin-top:9px;font-size:15.5px;font-weight:650;color:var(--grn)}.du.red{color:var(--red)}.du.yel{color:#b87400}.du.no{color:var(--mu)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--br)}.fm label{font-size:12.5px;color:var(--mu);display:block;margin:0 0 4px 4px}.fm input{box-shadow:none}
.acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.acts button{flex:1 1 120px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:color-mix(in srgb,var(--card) 93%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--br);display:flex;justify-content:space-around;align-items:flex-end;padding:7px 4px calc(9px + env(safe-area-inset-bottom))}
.bar button{background:none;color:var(--mu);box-shadow:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:4px 8px;min-width:60px;font-weight:650}.bar button span{font-size:23px;line-height:1.1}.bar button.on{color:var(--pri)}
.bar .fab{background:var(--pri);color:#fff;width:64px;height:64px;border-radius:50%;margin-top:-28px;box-shadow:0 8px 20px #2557e766;justify-content:center;border:4px solid var(--bg)}.bar .fab span{font-size:27px}
.modal{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}
.mb{background:var(--card);border-radius:28px;padding:20px;max-width:560px;width:100%;max-height:92vh;overflow:auto}.mb h3{margin:0 0 8px;font-size:21px}
.mlist{display:grid;gap:10px;margin:12px 0}.mlist button{padding:15px;text-align:left}
video{width:100%;border-radius:20px;background:#000}.hist{font-size:14px;border-bottom:1px solid var(--br);padding:8px 0}.hist small{color:var(--mu)}
</style></head><body><div id="app"></div><script src="app.js?v=5"></script></body></html>
