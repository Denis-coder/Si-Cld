<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Учёт СИ</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#0b5ed7"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f8;--fg:#1b1f27;--card:#fff;--br:#d5dae3;--pri:#0b5ed7;--red:#d62828;--grn:#2e9e4f;--yel:#e9a800}
@media(prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e8eaee;--card:#1e232b;--br:#333b47}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--pri);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header b{flex:1;font-size:17px}main{padding:10px;max-width:900px;margin:auto}
button,select,input{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--br);background:var(--card);color:var(--fg)}
button{cursor:pointer;background:var(--pri);color:#fff;border:0}button.g{background:#5b6472}button.r{background:var(--red)}button.s{padding:5px 9px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.row>*{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}.st{background:var(--card);border-radius:10px;padding:8px 10px;border-left:5px solid var(--br)}
.st b{font-size:22px;display:block}.st small{opacity:.75}.st.red{border-color:var(--red)}.st.yel{border-color:var(--yel)}.st.grn{border-color:var(--grn)}
.card{background:var(--card);border-radius:10px;padding:10px 12px;margin:8px 0;border-left:6px solid var(--br)}
.card.red{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}.card.yel{border-color:var(--yel);background:color-mix(in srgb,var(--yel) 14%,var(--card))}.card.grn{border-color:var(--grn);background:color-mix(in srgb,var(--grn) 9%,var(--card))}
.card h4{margin:0 0 3px;font-size:15px}.card .sub{opacity:.8;font-size:13px}.bd{float:right;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;color:#fff;background:#5b6472}
.red .bd{background:var(--red)}.yel .bd{background:var(--yel)}.grn .bd{background:var(--grn)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:8px}.fm label{font-size:12px;opacity:.8;display:block}.fm input,.fm select{width:100%}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:10px}.mb{background:var(--card);border-radius:12px;padding:14px;max-width:560px;width:100%;max-height:92vh;overflow:auto}
video{width:100%;border-radius:10px;background:#000}.hist{font-size:13px;border-bottom:1px solid var(--br);padding:6px 0}.hist small{opacity:.7}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button{flex:1}.center{text-align:center}
</style></head><body><div id="app"></div><script src="app.js"></script></body></html>
